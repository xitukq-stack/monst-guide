

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#10131e">

<title>MONST GUIDE</title>

<style>

*{box-sizing:border-box}

:root{

  --bg:#10131e;

  --panel:#1b2131;

  --panel2:#252d40;

  --purple:#9569e8;

  --purple2:#c6a4ff;

  --text:#f5f3ff;

  --muted:#a8b0c3;

}

body{

  margin:0;

  padding:10px 12px 22px;

  background:var(--bg);

  color:var(--text);

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

}

header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  margin:3px 2px 10px;

}

h1{

  margin:0;

  font-size:19px;

  letter-spacing:.5px;

  color:var(--purple2);

}

.tag{

  font-size:10px;

  color:#d7c1ff;

  border:1px solid #7756ae;

  border-radius:20px;

  padding:4px 8px;

  white-space:nowrap;

}

.panel{

  background:var(--panel);

  border:1px solid #2b3449;

  border-radius:13px;

  padding:10px;

  margin:9px 0;

}

button,.file-button{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  min-height:36px;

  padding:8px 11px;

  border:1px solid #9a78df;

  border-radius:9px;

  background:var(--purple);

  color:white;

  font-size:13px;

  font-weight:700;

  text-align:center;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;

}

button:active,.file-button:active{

  transform:scale(.98);

  filter:brightness(1.15);

}

button.secondary{

  background:var(--panel2);

  border-color:#46516b;

  color:#e7e4f1;

}

button.active{

  background:#513b80;

  border-color:#d0b5ff;

  box-shadow:0 0 0 1px #d0b5ff inset;

}

button.danger{

  background:#492b43;

  border-color:#9b557d;

}

input[type=file]{display:none}

input[type=range]{

  width:100%;

  height:20px;

  margin:3px 0;

  accent-color:var(--purple2);

}

input[type=color]{

  width:38px;

  height:30px;

  padding:1px;

  border:1px solid #56617a;

  border-radius:7px;

  background:var(--panel2);

}

.upload{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

}

.upload .small{

  flex:1;

}

.small{

  margin:5px 0 0;

  color:var(--muted);

  font-size:11px;

  line-height:1.45;

}

.stage-label{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin:0 2px 6px;

  color:var(--muted);

  font-size:10px;

  letter-spacing:1px;

}

.stage-wrap{

  height:54dvh;

  min-height:270px;

  max-height:590px;

  width:100%;

  display:grid;

  place-items:center;

  overflow:hidden;

  border:1px solid #303950;

  border-radius:12px;

  background:#090c14;

  touch-action:none;

}

#stage{

  display:block;

  width:auto;

  height:auto;

  max-width:100%;

  max-height:100%;

  border-radius:5px;

  touch-action:none;

}

.control-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:8px;

  margin-bottom:5px;

  font-size:12px;

  color:#e9e4f5;

}

.value{

  color:var(--purple2);

  font-size:17px;

  font-weight:700;

  font-variant-numeric:tabular-nums;

}

.angle-buttons{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;

  margin-top:5px;

}

.angle-buttons button{

  min-height:37px;

  font-size:13px;

}

.control-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px 12px;

}

.control-item{

  min-width:0;

}

.control-item.full{

  grid-column:1/-1;

}

.mode-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;

}

.action-grid{

  display:grid;

  grid-template-columns:1fr 1fr 1fr;

  gap:7px;

  margin-top:7px;

}

.action-grid button{

  font-size:11px;

  padding:7px 4px;

}

#message{

  margin:8px 2px 0;

  color:#b8c0d2;

  font-size:11px;

  line-height:1.4;

}

@media(max-width:360px){

  body{padding:8px}

  h1{font-size:17px}

  .panel{padding:8px}

  button,.file-button{font-size:12px;padding:7px}

  .stage-wrap{height:52dvh}

}

</style>

</head>

<body>

<header>

  <h1>🎯 MONST GUIDE</h1>

  <span class="tag">PHILOSOPHIA</span>

</header>

<div class="panel upload">

  <label class="file-button" for="photo">📷 スクショ読み込み</label>

  <input id="photo" type="file" accept="image/*">

  <p class="small">画像全体を表示するよ</p>

</div>

<div class="stage-label">

  <span>STAGE VIEW</span>

  <span id="imageInfo">画像未読み込み</span>

</div>

<div class="stage-wrap">

  <canvas id="stage" width="900" height="1600"></canvas>

</div>

<div class="panel">

  <div class="control-grid">

    <div class="control-item full">

      <div class="control-head">

        <span>ANGLE / 角度</span>

        <span class="value" id="angleValue">45.00°</span>

      </div>

      <input id="angle" type="range"

        min="0" max="359.8" step="0.35" value="45">

      <div class="angle-buttons">

        <button id="minus">− 0.35°</button>

        <button id="plus">＋ 0.35°</button>

      </div>

    </div>

    <div class="control-item full">

      <div class="control-head">

        <span>BOUNCE / バウンド回数</span>

        <span class="value" id="bounceValue">3回</span>

      </div>

      <input id="bounce" type="range" min="0" max="20" value="3">

    </div>

    <div class="control-item">

      <div class="control-head">

        <span>軌道線カラー</span>

      </div>

      <input id="lineColor" type="color" value="#00ffcc">

    </div>

    <div class="control-item">

      <div class="control-head">

        <span>ブロック数</span>

        <span class="value" id="blockCount">0</span>

      </div>

    </div>

  </div>

</div>

<div class="panel">

  <div class="mode-grid">

    <button id="originMode" class="active">🎯 発射位置</button>

    <button id="blockMode" class="secondary">🧱 ブロック配置</button>

  </div>

  <div class="action-grid">

    <button id="undoBlock" class="secondary">↩ 1個戻す</button>

    <button id="clearBlocks" class="danger">全消去</button>

    <button id="saveImage" class="secondary">画像保存</button>

  </div>

  <p id="message">ステージをタップして発射位置を設定してね。</p>

</div>

<script>

const canvas=document.getElementById("stage");

const ctx=canvas.getContext("2d");

const photo=document.getElementById("photo");

const angle=document.getElementById("angle");

const bounce=document.getElementById("bounce");

const color=document.getElementById("lineColor");

const angleValue=document.getElementById("angleValue");

const bounceValue=document.getElementById("bounceValue");

const blockCount=document.getElementById("blockCount");

const message=document.getElementById("message");

const imageInfo=document.getElementById("imageInfo");

let image=null;

let origin={x:450,y:1280};

let blocks=[];

let blockMode=false;

let originMode=true;

const BLOCK_SIZE=22;

function updateInfo(){

  angleValue.textContent=Number(angle.value).toFixed(2)+"°";

  bounceValue.textContent=bounce.value+"回";

  blockCount.textContent=blocks.length;

}

function draw(){

  const w=canvas.width;

  const h=canvas.height;

  ctx.clearRect(0,0,w,h);

  ctx.fillStyle="#111522";

  ctx.fillRect(0,0,w,h);

  if(image){

    ctx.drawImage(image,0,0,w,h);

  }else{

    ctx.fillStyle="#aeb7ca";

    ctx.font="28px sans-serif";

    ctx.textAlign="center";

    ctx.fillText("スクショを読み込んでね",w/2,h/2);

  }

  // ブロック表示

  blocks.forEach((b,i)=>{

    ctx.fillStyle="rgba(255,65,110,.65)";

    ctx.fillRect(

      b.x-BLOCK_SIZE,

      b.y-BLOCK_SIZE,

      BLOCK_SIZE*2,

      BLOCK_SIZE*2

    );

    ctx.strokeStyle="#ff91b0";

    ctx.lineWidth=3;

    ctx.strokeRect(

      b.x-BLOCK_SIZE,

      b.y-BLOCK_SIZE,

      BLOCK_SIZE*2,

      BLOCK_SIZE*2

    );

    ctx.fillStyle="white";

    ctx.font="bold 17px sans-serif";

    ctx.textAlign="center";

    ctx.fillText(String(i+1),b.x,b.y+6);

  });

  drawTrajectory();

  // 発射位置

  ctx.beginPath();

  ctx.arc(origin.x,origin.y,15,0,Math.PI*2);

  ctx.fillStyle="#ffe45c";

  ctx.fill();

  ctx.strokeStyle="#ffffff";

  ctx.lineWidth=3;

  ctx.stroke();

  updateInfo();

}

function drawTrajectory(){

  const w=canvas.width;

  const h=canvas.height;

  let x=origin.x;

  let y=origin.y;

  const rad=Number(angle.value)*Math.PI/180;

  let dx=Math.cos(rad);

  let dy=-Math.sin(rad);

  let hits=0;

  let previousBlock=-1;

  ctx.beginPath();

  ctx.moveTo(x,y);

  for(let i=0;i<5000;i++){

    let nx=x+dx*2;

    let ny=y+dy*2;

    if(nx<0||nx>w){

      dx=-dx;

      hits++;

      nx=x+dx*2;

    }

    if(ny<0||ny>h){

      dy=-dy;

      hits++;

      ny=y+dy*2;

    }

    x=nx;

    y=ny;

    let touched=-1;

    for(let j=0;j<blocks.length;j++){

      const b=blocks[j];

      if(

        Math.abs(x-b.x)<BLOCK_SIZE+2 &&

        Math.abs(y-b.y)<BLOCK_SIZE+2

      ){

        touched=j;

        break;

      }

    }

    if(touched!==-1 && touched!==previousBlock){

      dx=-dx;

      dy=-dy;

      hits++;

    }

    previousBlock=touched;

    ctx.lineTo(x,y);

    if(hits>Number(bounce.value))break;

  }

  ctx.strokeStyle=color.value;

  ctx.lineWidth=4;

  ctx.lineCap="round";

  ctx.lineJoin="round";

  ctx.shadowColor=color.value;

  ctx.shadowBlur=8;

  ctx.stroke();

  ctx.shadowBlur=0;

}

// 画像読み込み

photo.addEventListener("change",e=>{

  const file=e.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=event=>{

    const next=new Image();

    next.onload=()=>{

      image=next;

      // 大きすぎる画像だけ縮小。縦横比は維持。

      const maxSize=1600;

      const scale=Math.min(

        maxSize/image.width,

        maxSize/image.height,

        1

      );

      canvas.width=Math.max(1,Math.round(image.width*scale));

      canvas.height=Math.max(1,Math.round(image.height*scale));

      origin={

        x:canvas.width/2,

        y:canvas.height*.8

      };

      blocks=[];

      imageInfo.textContent=

        image.width+" × "+image.height;

      message.textContent=

        "画像を読み込んだよ。発射位置をタップしてね。";

      draw();

    };

    next.onerror=()=>{

      alert("画像を読み込めませんでした");

    };

    next.src=event.target.result;

  };

  reader.onerror=()=>{

    alert("ファイルの読み込みに失敗しました");

  };

  reader.readAsDataURL(file);

});

// 角度・バウンド・色

angle.addEventListener("input",draw);

bounce.addEventListener("input",draw);

color.addEventListener("input",draw);

// 角度を0.35度ずつ変更

function changeAngle(amount){

  let current=Math.round(Number(angle.value)*100);

  current+=Math.round(amount*100);

  const max=Math.round(359.8*100);

  if(current<0)current=max;

  if(current>max)current=0;

  angle.value=current/100;

  draw();

}

document.getElementById("minus").onclick=()=>{

  changeAngle(-0.35);

};

document.getElementById("plus").onclick=()=>{

  changeAngle(0.35);

};

// 発射位置モード

document.getElementById("originMode").onclick=()=>{

  blockMode=false;

  originMode=true;

  document.getElementById("originMode").classList.add("active");

  document.getElementById("blockMode").classList.remove("active");

  document.getElementById("blockMode").classList.add("secondary");

  message.textContent=

    "ステージをタップして発射位置を決めてね。";

};

// ブロックモード

document.getElementById("blockMode").onclick=()=>{

  blockMode=!blockMode;

  originMode=false;

  document.getElementById("blockMode").classList.toggle("active",blockMode);

  document.getElementById("blockMode").classList.toggle("secondary",!blockMode);

  document.getElementById("originMode").classList.remove("active");

  message.textContent=blockMode

    ?"ステージをタップしてブロックを配置してね。"

    :"ブロック配置モードを終了したよ。";

};

// ステージタップ

canvas.addEventListener("pointerdown",e=>{

  const r=canvas.getBoundingClientRect();

  const x=(e.clientX-r.left)*canvas.width/r.width;

  const y=(e.clientY-r.top)*canvas.height/r.height;

  if(blockMode){

    blocks.push({x,y});

  }else if(originMode){

    origin={

      x:Math.max(0,Math.min(canvas.width,x)),

      y:Math.max(0,Math.min(canvas.height,y))

    };

  }

  draw();

});

// ブロックを1個戻す

document.getElementById("undoBlock").onclick=()=>{

  if(blocks.length>0){

    blocks.pop();

    draw();

    message.textContent="最後に置いたブロックを取り消したよ。";

  }

};

// ブロック全消去

document.getElementById("clearBlocks").onclick=()=>{

  blocks=[];

  draw();

  message.textContent="ブロックをすべて消去したよ。";

};

// PNG保存

document.getElementById("saveImage").onclick=()=>{

  const a=document.createElement("a");

  a.download="monst-guide.png";

  a.href=canvas.toDataURL("image/png");

  a.click();

};

draw();

</script>

</body>

</html>
